server:
  port: 8081
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
spring:
  application:
    name: reception-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${RECEPTION_DB_URL:jdbc:postgresql://localhost:5434/hotelos}
    username: ${RECEPTION_DB_USER:reception_user}
    password: ${RECEPTION_DB_PASSWORD:reception_dev_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: reception
  flyway:
    enabled: true
    default-schema: reception
    schemas: reception
    baseline-on-migrate: false
    clean-disabled: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false
hotelos:
  hotel-zone: ${HOTELOS_HOTEL_ZONE:Asia/Tashkent}
  reception:
    strict-room-service-barrier: ${HOTELOS_RECEPTION_STRICT_ROOM_SERVICE_BARRIER:true}
  room-service:
    service-url: ${ROOM_SERVICE_URL:http://localhost:8083}
  outbox:
    poll-interval-ms: 500
    batch-size: 10
    confirm-timeout-ms: 3000
