worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Temp paths for non-root / read-only filesystem compatibility
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp_path;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Request body & header limits
    client_max_body_size 10M;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # Proxy timeouts
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Query parameter sanitization: extract request path without query string.
    # Prevents sensitive parameters (such as ?ticket=...) from appearing in access logs.
    map $request_uri $sanitized_uri {
        ~(?<uri_path>[^?]+) $uri_path;
        default $request_uri;
    }

    log_format sanitized '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $sanitized_uri $server_protocol" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent"';

    access_log /var/log/nginx/access.log sanitized;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=ticket_limit:10m rate=10r/s;
    limit_req_status 429;

    # Upstreams (RFC 1123 compliant naming without underscores)
    upstream gateway-backend {
        server gateway-service:8090;
        keepalive 32;
    }

    upstream dashboard-backend {
        server dashboard-service:8085;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
