server:
  port: 8090
  shutdown: graceful
  forward-headers-strategy: none
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: gateway-service
  lifecycle:
    timeout-per-shutdown-phase: 20s

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    doc-expansion: none
    filter: true
    display-operation-id: true
    display-request-duration: true
    enabled: ${HOTELOS_SWAGGER_ENABLED:true}
  api-docs:
    path: /v3/api-docs
    enabled: ${HOTELOS_SWAGGER_ENABLED:true}

hotelos:
  jwt:
    public-key-path: ${HOTELOS_JWT_PUBLIC_KEY_PATH:secrets/jwt-public.pem}
    kid: ${HOTELOS_JWT_KID:hotelos-rsa-key-1}
    issuer: ${HOTELOS_JWT_ISSUER:hotelos-identity}
    audience: ${HOTELOS_JWT_AUDIENCE:hotelos-api}
  cors:
    allowed-origins: ${HOTELOS_CORS_ALLOWED_ORIGINS:http://localhost:8085,http://localhost:8090,http://127.0.0.1:8085,http://127.0.0.1:8090}
  services:
    reception-url: ${RECEPTION_SERVICE_URL:http://localhost:8081}
    housekeeping-url: ${HOUSEKEEPING_SERVICE_URL:http://localhost:8082}
    room-service-url: ${ROOM_SERVICE_URL:http://localhost:8083}
    maintenance-url: ${MAINTENANCE_SERVICE_URL:http://localhost:8084}
    dashboard-url: ${DASHBOARD_SERVICE_URL:http://localhost:8085}
    identity-url: ${IDENTITY_SERVICE_URL:http://localhost:8086}
  gateway:
    trusted-proxies: ${HOTELOS_GATEWAY_TRUSTED_PROXIES:edge,nginx}

management:
  endpoints:
    web:
      exposure:
        include: "health"
  endpoint:
    health:
      show-details: never
