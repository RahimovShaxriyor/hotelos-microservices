services:
  edge:
    build:
      context: .
      dockerfile: ./docker/edge/Dockerfile
    image: hotelos-edge:latest
    restart: unless-stopped
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
    networks:
      - edge-net
    depends_on:
      gateway-service:
        condition: service_healthy
      dashboard-service:
        condition: service_healthy
    volumes:
      - ${TLS_CERT_PATH:?Required TLS_CERT_PATH in production}:/etc/nginx/certs/tls.crt:ro
      - ${TLS_KEY_PATH:?Required TLS_KEY_PATH in production}:/etc/nginx/certs/tls.key:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://localhost:80/api/gateway/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M

  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required POSTGRES_PASSWORD in production}
      POSTGRES_DB: ${POSTGRES_DB:-hotelos}
      RECEPTION_SCHEMA: ${RECEPTION_SCHEMA:-reception}
      RECEPTION_DB_USER: ${RECEPTION_DB_USER:-reception_user}
      RECEPTION_DB_PASSWORD: ${RECEPTION_DB_PASSWORD:?Required RECEPTION_DB_PASSWORD in production}
      ROOM_SERVICE_SCHEMA: ${ROOM_SERVICE_SCHEMA:-room_service}
      ROOM_SERVICE_DB_USER: ${ROOM_SERVICE_DB_USER:-room_service_user}
      ROOM_SERVICE_DB_PASSWORD: ${ROOM_SERVICE_DB_PASSWORD:?Required ROOM_SERVICE_DB_PASSWORD in production}
      HOUSEKEEPING_SCHEMA: ${HOUSEKEEPING_SCHEMA:-housekeeping}
      HOUSEKEEPING_DB_USER: ${HOUSEKEEPING_DB_USER:-housekeeping_user}
      HOUSEKEEPING_DB_PASSWORD: ${HOUSEKEEPING_DB_PASSWORD:?Required HOUSEKEEPING_DB_PASSWORD in production}
      MAINTENANCE_SCHEMA: ${MAINTENANCE_SCHEMA:-maintenance}
      MAINTENANCE_DB_USER: ${MAINTENANCE_DB_USER:-maintenance_user}
      MAINTENANCE_DB_PASSWORD: ${MAINTENANCE_DB_PASSWORD:?Required MAINTENANCE_DB_PASSWORD in production}
      DASHBOARD_SCHEMA: ${DASHBOARD_SCHEMA:-dashboard_read}
      DASHBOARD_DB_USER: ${DASHBOARD_DB_USER:-dashboard_user}
      DASHBOARD_DB_PASSWORD: ${DASHBOARD_DB_PASSWORD:?Required DASHBOARD_DB_PASSWORD in production}
      IDENTITY_SCHEMA: ${IDENTITY_SCHEMA:-identity}
      IDENTITY_DB_USER: ${IDENTITY_DB_USER:-identity_user}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Required IDENTITY_DB_PASSWORD in production}
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  rabbitmq:
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Required RABBITMQ_USER in production}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Required RABBITMQ_PASSWORD in production}
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  reception-service:
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    environment:
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:?Required RABBITMQ_USER in production}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Required RABBITMQ_PASSWORD in production}
      RECEPTION_DB_PASSWORD: ${RECEPTION_DB_PASSWORD:?Required RECEPTION_DB_PASSWORD in production}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 150
        reservations:
          memory: 256M

  housekeeping-service:
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    environment:
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:?Required RABBITMQ_USER in production}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Required RABBITMQ_PASSWORD in production}
      HOUSEKEEPING_DB_PASSWORD: ${HOUSEKEEPING_DB_PASSWORD:?Required HOUSEKEEPING_DB_PASSWORD in production}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 150
        reservations:
          memory: 256M

  room-service:
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    environment:
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:?Required RABBITMQ_USER in production}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Required RABBITMQ_PASSWORD in production}
      ROOM_SERVICE_DB_PASSWORD: ${ROOM_SERVICE_DB_PASSWORD:?Required ROOM_SERVICE_DB_PASSWORD in production}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 150
        reservations:
          memory: 256M

  maintenance-service:
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    environment:
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:?Required RABBITMQ_USER in production}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Required RABBITMQ_PASSWORD in production}
      MAINTENANCE_DB_PASSWORD: ${MAINTENANCE_DB_PASSWORD:?Required MAINTENANCE_DB_PASSWORD in production}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 150
        reservations:
          memory: 256M

  dashboard-service:
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    environment:
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:?Required RABBITMQ_USER in production}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Required RABBITMQ_PASSWORD in production}
      DASHBOARD_DB_PASSWORD: ${DASHBOARD_DB_PASSWORD:?Required DASHBOARD_DB_PASSWORD in production}
      HOTELOS_WS_ALLOWED_ORIGINS: ${HOTELOS_PUBLIC_ORIGIN:?Required HOTELOS_PUBLIC_ORIGIN in production}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 150
        reservations:
          memory: 256M

  identity-service:
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ${JWT_PRIVATE_KEY_PATH:?Required JWT_PRIVATE_KEY_PATH in production}:/secrets/jwt-private.pem:ro
      - ${JWT_PUBLIC_KEY_PATH:?Required JWT_PUBLIC_KEY_PATH in production}:/secrets/jwt-public.pem:ro
    environment:
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Required IDENTITY_DB_PASSWORD in production}
      HOTELOS_BOOTSTRAP_ADMIN_USERNAME: ${HOTELOS_BOOTSTRAP_ADMIN_USERNAME:?Required HOTELOS_BOOTSTRAP_ADMIN_USERNAME in production}
      HOTELOS_BOOTSTRAP_ADMIN_PASSWORD: ${HOTELOS_BOOTSTRAP_ADMIN_PASSWORD:?Required HOTELOS_BOOTSTRAP_ADMIN_PASSWORD in production}
      HOTELOS_SWAGGER_ENABLED: "false"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 150
        reservations:
          memory: 256M

  gateway-service:
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    volumes:
      - ${JWT_PUBLIC_KEY_PATH:?Required JWT_PUBLIC_KEY_PATH in production}:/secrets/jwt-public.pem:ro
    environment:
      HOTELOS_SWAGGER_ENABLED: "false"
      HOTELOS_CORS_ALLOWED_ORIGINS: ${HOTELOS_PUBLIC_ORIGIN:?Required HOTELOS_PUBLIC_ORIGIN in production}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 150
        reservations:
          memory: 256M

networks:
  internal-data:
    internal: true
